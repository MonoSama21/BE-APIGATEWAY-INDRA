openapi: 3.0.0
info:
  title: API Restaurante QR - DEVQORA
  description: Documentación de la API REST para el sistema de gestión de restaurante con código QR
  version: 1.0.0
  contact:
    name: DEVQORA
    email: soporte@devqora.com

servers:
  - url: http://localhost:6505
    description: Servidor de desarrollo
  - url: https://api.restauranteqr.com
    description: Servidor de producción

tags:
  - name: Autenticación
    description: Endpoints de autenticación y login
  - name: Usuarios
    description: Gestión de usuarios del sistema
  - name: Categorías
    description: Gestión de categorías de platos
  - name: Platos
    description: Gestión de platos del menú
  - name: Configuración
    description: Configuración general del sistema

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: "Alexis"
        email:
          type: string
          format: email
          example: "alexis@restaurante.com"
        rol:
          type: string
          enum: [Admin, Usuario]
          example: "Admin"
        activo:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UsuarioCreate:
      type: object
      required:
        - nombre
        - email
        - password
        - rol
      properties:
        nombre:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan@restaurante.com"
        password:
          type: string
          format: password
          example: "123456"
        rol:
          type: string
          enum: [Admin, Usuario]
          example: "Admin"
        activo:
          type: boolean
          example: true

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "alexis@restaurante.com"
        password:
          type: string
          format: password
          example: "123456"

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Login exitoso"
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    Categoria:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: "Entradas"
        descripcion:
          type: string
          example: "Platos de entrada"
        activo:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoriaCreate:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
          example: "Postres"
        descripcion:
          type: string
          example: "Dulces y postres"
        activo:
          type: boolean
          example: true

    Plato:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: "Ceviche"
        descripcion:
          type: string
          example: "Ceviche de pescado fresco"
        precio:
          type: number
          format: float
          example: 25.50
        imagen_url:
          type: string
          example: "https://example.com/ceviche.jpg"
        disponible:
          type: boolean
          example: true
        categoriaId:
          type: integer
          example: 1
        categoria:
          $ref: '#/components/schemas/Categoria'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlatoCreate:
      type: object
      required:
        - nombre
        - precio
        - categoriaId
      properties:
        nombre:
          type: string
          example: "Lomo Saltado"
        descripcion:
          type: string
          example: "Lomo saltado con papas fritas"
        precio:
          type: number
          format: float
          example: 35.00
        imagen_url:
          type: string
          example: "https://example.com/lomo.jpg"
        disponible:
          type: boolean
          example: true
        categoriaId:
          type: integer
          example: 2

    Configuracion:
      type: object
      properties:
        id:
          type: integer
          example: 1
        restaurante_nombre:
          type: string
          example: "Restaurante El Buen Sabor"
        logo_url:
          type: string
          example: "https://example.com/logo.png"
        descripcion:
          type: string
          example: "El mejor restaurante de la ciudad"
        direccion:
          type: string
          example: "Av. Principal 123"
        telefono:
          type: string
          example: "555-1234"
        email:
          type: string
          format: email
          example: "info@restaurante.com"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error descripción"

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operación exitosa"
        data:
          type: object

paths:
  /usuarios/login:
    post:
      tags:
        - Autenticación
      summary: Login de usuario
      description: Autentica un usuario y devuelve un token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Datos incompletos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /usuarios:
    get:
      tags:
        - Usuarios
      summary: Obtener todos los usuarios
      description: Retorna una lista de todos los usuarios sin el campo password
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Usuario'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Usuarios
      summary: Crear un nuevo usuario
      description: Crea un nuevo usuario en el sistema (contraseña encriptada con bcrypt)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreate'
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Datos inválidos o usuario ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /usuarios/{id}:
    get:
      tags:
        - Usuarios
      summary: Obtener un usuario por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del usuario
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Usuario'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Usuarios
      summary: Actualizar un usuario
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreate'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '404':
          description: Usuario no encontrado

    delete:
      tags:
        - Usuarios
      summary: Eliminar un usuario
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '404':
          description: Usuario no encontrado

  /categorias:
    get:
      tags:
        - Categorías
      summary: Obtener todas las categorías
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Categoria'

    post:
      tags:
        - Categorías
      summary: Crear una nueva categoría
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaCreate'
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /categorias/{id}:
    get:
      tags:
        - Categorías
      summary: Obtener una categoría por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Categoria'

    put:
      tags:
        - Categorías
      summary: Actualizar una categoría
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaCreate'
      responses:
        '200':
          description: Categoría actualizada

    delete:
      tags:
        - Categorías
      summary: Eliminar una categoría (elimina platos en cascada)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Categoría eliminada

  /platos:
    get:
      tags:
        - Platos
      summary: Obtener todos los platos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de platos con sus categorías
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plato'

    post:
      tags:
        - Platos
      summary: Crear un nuevo plato
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatoCreate'
      responses:
        '201':
          description: Plato creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '404':
          description: Categoría no encontrada

  /platos/{id}:
    get:
      tags:
        - Platos
      summary: Obtener un plato por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Plato encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Plato'

    put:
      tags:
        - Platos
      summary: Actualizar un plato
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatoCreate'
      responses:
        '200':
          description: Plato actualizado

    delete:
      tags:
        - Platos
      summary: Eliminar un plato
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Plato eliminado

  /configuracion:
    get:
      tags:
        - Configuración
      summary: Obtener la configuración del sistema
      description: Retorna la única configuración del restaurante (ID siempre es 1)
      responses:
        '200':
          description: Configuración del sistema
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Configuracion'

    post:
      tags:
        - Configuración
      summary: Crear o actualizar configuración
      description: Si existe (ID=1) actualiza, si no existe la crea
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configuracion'
      responses:
        '200':
          description: Configuración guardada

    put:
      tags:
        - Configuración
      summary: Actualizar configuración
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configuracion'
      responses:
        '200':
          description: Configuración actualizada