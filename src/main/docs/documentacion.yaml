openapi: 3.0.3
info:
  title: API RestauranteQR
  version: 1.0.0
  description: API para gestión de usuarios (novios), citas, registros de citas y fotos asociadas.
servers:
  - url: http://localhost:6500
paths:
  /novios:
    get:
      summary: Obtener todos los usuarios
      responses:
        '200':
          description: Lista de usuarios
    post:
      summary: Registrar un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                email:
                  type: string
                telefono:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Usuario creado
  /novios/login:
    post:
      summary: Login de usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login exitoso
  /novios/{id}:
    get:
      summary: Obtener detalle de usuario
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de usuario
  /novios/password:
    put:
      summary: Cambiar contraseña
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Contraseña cambiada
  /citas:
    get:
      summary: Obtener citas paginadas
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Lista de citas
  /registros-citas:
    post:
      summary: Registrar una cita con fotos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                citaId:
                  type: integer
                comentario:
                  type: string
                fotos:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Registro creado
    get:
      summary: Consultar registros de citas
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Lista de registros
  /registros-citas/{id}:
    patch:
      summary: Actualizar registro de cita (comentario, citaId, fotos)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                citaId:
                  type: integer
                comentario:
                  type: string
                fotos:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Registro actualizado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
