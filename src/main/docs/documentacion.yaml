openapi: 3.0.3
info:
  title: API Sistema de Asistencia QR - UGEL
  version: 2.0.0
  description: |
    API REST para el Sistema de Control de Asistencia mediante código QR de la UGEL.
    
    Gestiona usuarios del sistema, personal docente/administrativo, cargos y registros
    de asistencia (entrada/salida) mediante escaneo de código QR único por empleado.
    
    **Autenticación:** Los endpoints protegidos requieren un token JWT en el header
    `Authorization: Bearer <token>`. El token se obtiene en `POST /usuarios/login`.

servers:
  - url: http://localhost:6500
    description: Servidor de desarrollo local
  - url: https://be-asistencia-qrugel.vercel.app
    description: Servidor de producción (Vercel)

tags:
  - name: Usuarios
    description: Gestión de usuarios del sistema y autenticación
  - name: Personal
    description: Gestión del personal (docentes / administrativos) y sus códigos QR
  - name: Cargos
    description: Catálogo de cargos o puestos laborales
  - name: Distritos
    description: Catálogo de distritos o zonas educativas
  - name: Instituciones Educativas
    description: Catálogo de instituciones educativas con niveles/modalidades
  - name: Asistencia
    description: Registro y consulta de asistencia mediante código QR
  - name: Registros
    description: "Gestión de registros de culminación de misiones (juego SSTMON)"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Usuarios ──────────────────────────────────────────────
    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan@ugel.gob.pe"
        rol:
          type: string
          example: "admin"
        telefono:
          type: string
          example: "987654321"
        estado:
          type: boolean
          example: true

    # ── Cargos ────────────────────────────────────────────────
    Cargo:
      type: object
      properties:
        id:
          type: integer
          example: 1
        cargo:
          type: string
          example: "Director"
        descripcion:
          type: string
          example: "Director de la institución educativa"
        estado:
          type: boolean
          example: true
        createdat:
          type: string
          format: date-time
        updatedat:
          type: string
          format: date-time

    # ── Distritos ─────────────────────────────────────────────
    Distrito:
      type: object
      properties:
        id:
          type: integer
          example: 1
        distrito:
          type: string
          example: "Grocio Prado"
        alias:
          type: string
          example: "GP"
        estado:
          type: boolean
          example: true
        createdat:
          type: string
          format: date-time
        updatedat:
          type: string
          format: date-time

    # ── Instituciones Educativas ──────────────────────────────
    InstitucionEducativa:
      type: object
      properties:
        id:
          type: integer
          example: 2
        codigoModular:
          type: string
          description: Código modular único de la institución educativa
          example: "0281774"
        nombreIE:
          type: string
          description: Nombre oficial de la institución educativa
          example: "22226 NUESTRA SEÑORA DE FATIMA"
        nivelModalidad:
          type: string
          enum: [INICIAL-JARDIN, PRIMARIA, SECUNDARIA, EBA-CEPTPRO]
          description: Nivel/modalidad educativa de la institución
          example: "PRIMARIA"
        distritoId:
          type: integer
          nullable: true
          description: ID del distrito donde está ubicada la institución educativa
          example: 1
        distrito:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            distrito:
              type: string
            alias:
              type: string
        estado:
          type: boolean
          example: true
        createdat:
          type: string
          format: date-time
        updatedat:
          type: string
          format: date-time

    # ── Personal ──────────────────────────────────────────────
    Personal:
      type: object
      properties:
        id:
          type: integer
          example: 5
        dni:
          type: string
          minLength: 8
          maxLength: 8
          example: "12345678"
        nombres:
          type: string
          example: "María"
        apellidos:
          type: string
          example: "García López"
        cargoId:
          type: integer
          example: 2
        cargo:
          $ref: '#/components/schemas/Cargo'
        distritoId:
          type: integer
          nullable: true
          example: 1
        distrito:
          $ref: '#/components/schemas/Distrito'
        nivelModalidad:
          type: string
          nullable: true
          enum: [INICIAL-JARDIN, PRIMARIA, SECUNDARIA, EBA-CEPTPRO]
          description: Nivel/modalidad de la institución educativa (debe coincidir con la nivelModalidad de institucionEducativa)
          example: "PRIMARIA"
        institucionEducativaId:
          type: integer
          nullable: true
          description: ID de la institución educativa. Si se proporciona, su nivelModalidad debe coincidir con el nivelModalidad del personal
          example: 2
        institucionEducativa:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            codigoModular:
              type: string
            nombreIE:
              type: string
            nivelModalidad:
              type: string
        codigoQR:
          type: string
          description: Imagen QR codificada en base64 (data URI PNG) que contiene {id, dni, nombres, apellidos, cargoId, distritoId}
          example: "data:image/png;base64,iVBORw0KGgoAAAANS..."
        foto:
          type: string
          nullable: true
          description: URL de la foto del personal en Cloudinary
          example: "https://res.cloudinary.com/.../personal/foto.jpg"
        estado:
          type: boolean
          example: true
        createdat:
          type: string
          format: date-time
        updatedat:
          type: string
          format: date-time

    # ── Asistencia ────────────────────────────────────────────
    Asistencia:
      type: object
      properties:
        id:
          type: integer
          example: 10
        personalId:
          type: integer
          example: 5
        personal:
          type: object
          properties:
            id:
              type: integer
            dni:
              type: string
            nombres:
              type: string
            apellidos:
              type: string
            nivelModalidad:
              type: string
              nullable: true
              enum: [INICIAL-JARDIN, PRIMARIA, SECUNDARIA, EBA-CEPTPRO]
            cargo:
              type: object
              properties:
                cargo:
                  type: string
            distrito:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                distrito:
                  type: string
                alias:
                  type: string
            institucionEducativa:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                codigoModular:
                  type: string
                nombreIE:
                  type: string
                nivelModalidad:
                  type: string
        fecha:
          type: string
          format: date
          example: "2026-03-08"
        horaEntrada:
          type: string
          format: time
          nullable: true
          example: "08:05:12"
        horaSalida:
          type: string
          format: time
          nullable: true
          example: "17:00:45"
        horasTrabajadas:
          type: string
          nullable: true
          description: Tiempo trabajado en formato HH:MM
          example: "08:55"
        estado:
          type: string
          enum: [EN_CURSO, COMPLETO]
          example: "COMPLETO"
        usuarioIdEntrada:
          type: integer
          nullable: true
          description: ID del usuario que registró la ENTRADA (auditoría)
          example: 2
        usuarioNombreEntrada:
          type: string
          nullable: true
          description: Nombre del usuario que registró la ENTRADA (auditoría)
          example: "Personal Sistema"
        usuarioIdSalida:
          type: integer
          nullable: true
          description: ID del usuario que registró la SALIDA (auditoría)
          example: 1
        usuarioNombreSalida:
          type: string
          nullable: true
          description: Nombre del usuario que registró la SALIDA (auditoría)
          example: "Admin UGEL"
        createdat:
          type: string
          format: date-time

    # ── Registros ──────────────────────────────────────────────
    Registro:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombreCompleto:
          type: string
          description: Nombre completo del empleado que completó la misión
          example: "Carlos Pérez"
        dni:
          type: string
          description: DNI del empleado
          example: "12345678"
        cargo:
          type: string
          description: Cargo del empleado
          example: "Supervisor"
        missionId:
          type: integer
          description: ID de la misión (1=Trabajo en Altura, 2=Trabajos en Vía Pública, 3=Energías Peligrosas)
          example: 1
        missionName:
          type: string
          description: Nombre descriptivo de la misión
          example: "TRABAJO EN ALTURA"
        score:
          type: integer
          description: Número de respuestas correctas obtenidas
          example: 9
        total:
          type: integer
          description: Total de preguntas (normalmente 10)
          example: 10
        percentage:
          type: integer
          description: Porcentaje de respuestas correctas (0-100)
          example: 90
        approved:
          type: boolean
          description: Indicador si el empleado aprobó (score >= 8)
          example: true
        pokeball:
          type: string
          nullable: true
          description: Color de la pokebola seleccionada (red, blue, yellow)
          example: "red"
        completedAt:
          type: string
          format: date-time
          description: Fecha y hora en que se completó la misión
          example: "2026-05-05T14:30:00Z"

    # ── Respuestas genéricas ──────────────────────────────────
    RespuestaExito:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    RespuestaError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Descripción del error"

    RespuestaPaginada:
      type: object
      properties:
        success:
          type: boolean
          example: true
        total:
          type: integer
          example: 50
        pagina:
          type: integer
          example: 1
        limite:
          type: integer
          example: 10

# ══════════════════════════════════════════════════════════════
# PATHS
# ══════════════════════════════════════════════════════════════
paths:

  # ─────────────────────────────────────────────────────────────
  # USUARIOS
  # ─────────────────────────────────────────────────────────────
  /usuarios:
    post:
      tags: [Usuarios]
      summary: Registrar un nuevo usuario del sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, telefono, password, rol]
              properties:
                nombre:
                  type: string
                  example: "Juan Pérez"
                email:
                  type: string
                  format: email
                  example: "juan@ugel.gob.pe"
                telefono:
                  type: string
                  example: "987654321"
                password:
                  type: string
                  format: password
                  example: "contraseña123"
                rol:
                  type: string
                  example: "admin"
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaExito'
                  - type: object
                    properties:
                      message:
                        example: "Usuario Juan Pérez con ID 1 creado exitosamente"
        '400':
          description: Faltan campos, email duplicado o nombre duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

    get:
      tags: [Usuarios]
      summary: Obtener lista de usuarios con paginación
      parameters:
        - in: query
          name: estado
          schema:
            type: boolean
          description: Filtrar por estado activo/inactivo
          example: true
        - in: query
          name: pagina
          schema:
            type: integer
            default: 1
          description: Número de página
        - in: query
          name: limite
          schema:
            type: integer
            default: 10
          description: Cantidad de resultados por página
      responses:
        '200':
          description: Lista de usuarios paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaPaginada'
                  - type: object
                    properties:
                      usuarios:
                        type: array
                        items:
                          $ref: '#/components/schemas/Usuario'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /usuarios/login:
    post:
      tags: [Usuarios]
      summary: Iniciar sesión y obtener token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "juan@ugel.gob.pe"
                password:
                  type: string
                  format: password
                  example: "contraseña123"
      responses:
        '200':
          description: Login exitoso — retorna token JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login exitoso"
                  token:
                    type: string
                    description: Token JWT para usar en endpoints protegidos
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  usuariologeado:
                    $ref: '#/components/schemas/Usuario'
        '400':
          description: Usuario no encontrado o contraseña incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /usuarios/datos:
    put:
      tags: [Usuarios]
      summary: Actualizar datos del usuario autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: "Juan Carlos Pérez"
                email:
                  type: string
                  format: email
                  example: "juancarlos@ugel.gob.pe"
                telefono:
                  type: string
                  example: "912345678"
      responses:
        '200':
          description: Datos actualizados exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaExito'
        '401':
          description: Token no válido o no proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /usuarios/password:
    put:
      tags: [Usuarios]
      summary: Cambiar contraseña del usuario autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  example: "nuevaContraseña456"
      responses:
        '200':
          description: Contraseña actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaExito'
        '401':
          description: Token no válido o no proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Obtener detalle de un usuario por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del usuario
          example: 1
      responses:
        '200':
          description: Detalle del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

    delete:
      tags: [Usuarios]
      summary: Eliminar un usuario por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del usuario a eliminar
          example: 1
      responses:
        '200':
          description: Usuario eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaExito'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  # ─────────────────────────────────────────────────────────────
  # CARGOS
  # ─────────────────────────────────────────────────────────────
  /cargos:
    post:
      tags: [Cargos]
      summary: Registrar un nuevo cargo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cargo, descripcion]
              properties:
                cargo:
                  type: string
                  example: "Docente"
                descripcion:
                  type: string
                  example: "Docente de educación primaria"
      responses:
        '201':
          description: Cargo registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: string
                    example: "Cargo 'Docente' registrado exitosamente con ID 3"
        '400':
          description: Faltan campos o el cargo ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

    get:
      tags: [Cargos]
      summary: Obtener lista de cargos
      parameters:
        - in: query
          name: estado
          schema:
            type: boolean
          description: Filtrar por estado activo/inactivo
          example: true
      responses:
        '200':
          description: Lista de cargos
          content:
            application/json:
              schema:
                type: object
                properties:
                  succes:
                    type: boolean
                    example: true
                  cargos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cargo'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /cargos/{id}:
    put:
      tags: [Cargos]
      summary: Actualizar un cargo por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del cargo
          example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cargo:
                  type: string
                  example: "Docente Titular"
                descripcion:
                  type: string
                  example: "Docente titular de educación secundaria"
                estado:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Cargo actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  cargo:
                    $ref: '#/components/schemas/Cargo'
        '400':
          description: El nombre del cargo ya está en uso por otro registro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: Cargo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

    delete:
      tags: [Cargos]
      summary: Eliminar un cargo por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del cargo a eliminar
          example: 2
      responses:
        '200':
          description: Cargo eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaExito'
        '404':
          description: Cargo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  # ─────────────────────────────────────────────────────────────
  # DISTRITOS
  # ─────────────────────────────────────────────────────────────
  /distritos:
    post:
      tags: [Distritos]
      summary: Crear un nuevo distrito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [distrito, alias]
              properties:
                distrito:
                  type: string
                  example: "Grocio Prado"
                alias:
                  type: string
                  example: "GP"
      responses:
        '201':
          description: Distrito creado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaExito'
                  - type: object
                    properties:
                      distrito:
                        $ref: '#/components/schemas/Distrito'
        '400':
          description: Faltan campos o distrito duplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

    get:
      tags: [Distritos]
      summary: Obtener lista de distritos
      parameters:
        - in: query
          name: estado
          schema:
            type: boolean
          description: Filtrar por estado activo/inactivo
          example: true
      responses:
        '200':
          description: Lista de distritos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  distritos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Distrito'

  /distritos/{id}:
    put:
      tags: [Distritos]
      summary: Actualizar un distrito
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del distrito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                distrito:
                  type: string
                  example: "Chincha Alta"
                alias:
                  type: string
                  example: "CA"
                estado:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Distrito actualizado correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaExito'
                  - type: object
                    properties:
                      distrito:
                        $ref: '#/components/schemas/Distrito'
        '404':
          description: Distrito no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

    patch:
      tags: [Distritos]
      summary: Cambiar estado de un distrito
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del distrito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  type: boolean
                  example: false
      responses:
