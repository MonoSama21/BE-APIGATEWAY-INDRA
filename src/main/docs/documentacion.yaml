  # ─────────────────────────────────────────────────────────────
  # PERSONAL
  # ─────────────────────────────────────────────────────────────
  /personal:
    post:
      tags: [Personal]
      summary: Registrar nuevo personal y generar su código QR
      description: |
        Crea un nuevo empleado en el sistema. Al registrarse, se genera
        automáticamente un código QR único (base64 PNG) que contiene
        `{ id, dni, nombres, apellidos, cargoId, distritoId }`.
        
        **Campos requeridos:** dni, nombres, apellidos, cargoId
        
        **Campos opcionales:** distritoId, nivelModalidad, institucionEducativaId
        
        **Validación cruzada:** Si proporciona tanto `nivelModalidad` como `institucionEducativaId`,
        el `nivelModalidad` del personal DEBE coincidir con el `nivelModalidad` de la institución educativa.
        
        **Sobrescritura de distrito:** Si proporciona `institucionEducativaId`, el distrito del personal
        será automáticamente sobrescrito por el distrito asociado a esa institución educativa (si existe).
        Esto es útil para garantizar que el personal está asignado al correcto distrito según su institución.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dni, nombres, apellidos, cargoId]
              properties:
                dni:
                  type: string
                  minLength: 8
                  maxLength: 8
                  example: "12345678"
                nombres:
                  type: string
                  example: "María"
                apellidos:
                  type: string
                  example: "García López"
                cargoId:
                  type: integer
                  description: ID del cargo existente en la tabla cargos
                  example: 2
                distritoId:
                  type: integer
                  nullable: true
                  description: (Opcional) ID del distrito existente en la tabla distritos
                  example: 1
                nivelModalidad:
                  type: string
                  nullable: true
                  enum: [INICIAL-JARDIN, PRIMARIA, SECUNDARIA, EBA-CEPTPRO]
                  description: (Opcional) Nivel/modalidad. Si se proporciona institucionEducativaId, debe coincidir con su nivelModalidad
                  example: "PRIMARIA"
                institucionEducativaId:
                  type: integer
                  nullable: true
                  description: (Opcional) ID de la institución educativa. Su nivelModalidad debe coincidir con el del personal
                  example: 2
      responses:
        '201':
          description: Personal registrado exitosamente con QR generado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Personal María García López con ID 5 creado exitosamente"
                  personal:
                    $ref: '#/components/schemas/Personal'
        '400':
          description: |
            Validación fallida. Posibles errores:
            - Faltan campos requeridos (dni, nombres, apellidos, cargoId)
            - DNI duplicado
            - DNI inválido (debe tener 8 dígitos)
            - Cargo inexistente
            - Distrito inexistente
            - Institución educativa inexistente
            - Mismatch: nivelModalidad no coincide con el de la institucionEducativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

    get:
      tags: [Personal]
      summary: Obtener lista de personal con paginación y relación de cargo
      parameters:
        - in: query
          name: estado
          schema:
            type: boolean
          description: Filtrar por estado activo/inactivo
          example: true
        - in: query
          name: pagina
          schema:
            type: integer
            default: 1
          description: Número de página
        - in: query
          name: limite
          schema:
            type: integer
            default: 10
          description: Resultados por página
      responses:
        '200':
          description: Lista paginada de personal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaPaginada'
                  - type: object
                    properties:
                      personal:
                        type: array
                        items:
                          $ref: '#/components/schemas/Personal'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /personal/{id}:
    get:
      tags: [Personal]
      summary: Obtener detalle de un empleado por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del personal
          example: 5
      responses:
        '200':
          description: Detalle del personal con cargo completo
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  personal:
                    $ref: '#/components/schemas/Personal'
        '404':
          description: Personal no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

    put:
      tags: [Personal]
      summary: Actualizar datos de un empleado
      description: |
        Actualiza los datos del personal. Si se cambia el `cargoId`, `distritoId`,
        el DNI o algún dato relevante, el código QR se regenera automáticamente.
        
        **Validación cruzada:** Si proporciona tanto `nivelModalidad` como `institucionEducativaId`,
        el `nivelModalidad` del personal DEBE coincidir con el `nivelModalidad` de la institución educativa.
        
        **Sobrescritura de distrito:** Si proporciona `institucionEducativaId`, el distrito del personal
        será automáticamente sobrescrito por el distrito asociado a esa institución educativa (si existe).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del personal
          example: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dni:
                  type: string
                  example: "87654321"
                nombres:
                  type: string
                  example: "María Elena"
                apellidos:
                  type: string
                  example: "García Ruiz"
                cargoId:
                  type: integer
                  example: 3
                distritoId:
                  type: integer
                  nullable: true
                  example: 2
                nivelModalidad:
                  type: string
                  nullable: true
                  enum: [INICIAL-JARDIN, PRIMARIA, SECUNDARIA, EBA-CEPTPRO]
                  description: Nivel/modalidad. Si se proporciona institucionEducativaId, debe coincidir con su nivelModalidad
                  example: "PRIMARIA"
                institucionEducativaId:
                  type: integer
                  nullable: true
                  description: ID de la institución educativa. Su nivelModalidad debe coincidir con el del personal
                  example: 2
      responses:
        '200':
          description: Personal actualizado (QR regenerado si aplica)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  personal:
                    $ref: '#/components/schemas/Personal'
        '400':
          description: |
            Validación fallida. Posibles errores:
            - DNI duplicado (en otro registro)
            - DNI inválido (debe tener 8 dígitos)
            - Cargo inexistente
            - Distrito inexistente
            - Institución educativa inexistente
            - Mismatch: nivelModalidad no coincide con el de la institucionEducativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: Personal no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

    delete:
      tags: [Personal]
      summary: Eliminar un empleado por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del personal a eliminar
          example: 5
      responses:
        '200':
          description: Personal eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaExito'
        '404':
          description: Personal no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /personal/{id}/estado:
    put:
      tags: [Personal]
      summary: Cambiar estado activo/inactivo de un empleado
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del personal
          example: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
