                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token no válido o no proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: Institución educativa no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

