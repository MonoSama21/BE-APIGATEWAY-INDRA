              schema:
                $ref: '#/components/schemas/RespuestaError'

  /personal/importar-csv:
    post:
      tags: [Personal]
      summary: Importar múltiples personal desde archivo CSV
      description: |
        Carga masivamente personal desde un archivo CSV. Genera automáticamente
        códigos QR para cada registro exitoso.
        
        **Formato CSV esperado:**
        ```
        dni,nombres,apellidos,cargoId,distritoId,nivelModalidad,institucionEducativaId,estado
        12345678,Juan,Pérez,1,1,PRIMARIA,5,true
        87654321,María,García,2,2,SECUNDARIA,10,true
        ```
        
        **Campos obligatorios:** dni, nombres, apellidos, cargoId
        
        **Campos opcionales:** distritoId, nivelModalidad, institucionEducativaId, estado
        
        **Validaciones por cada fila:**
        - DNI debe tener 8 dígitos y ser único
        - cargoId debe existir en tabla `cargos`
        - distritoId debe existir en tabla `distritos` (si se proporciona)
        - nivelModalidad debe ser una de: INICIAL-JARDIN, PRIMARIA, SECUNDARIA, EBA-CEPTPRO
        - institucionEducativaId debe existir en tabla `institucionesEducativas` (si se proporciona)
        - Si se proporciona institucionEducativaId, el nivelModalidad debe coincidir
        
        **Respuesta:** La respuesta incluye un resumen con total de registros,
        éxitos, errores y detalles de cada fila procesada.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [csv]
              properties:
                csv:
                  type: string
                  format: binary
                  description: Archivo CSV con personales a importar
      responses:
        '200':
          description: Importación completada con resumen de resultados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Importación completada: 45 exitosos, 3 errores"
                  resumen:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 48
                      exitosos:
                        type: integer
                        example: 45
                      errores:
                        type: integer
                        example: 3
                  detalles:
                    type: array
                    items:
                      type: object
                      properties:
                        fila:
                          type: integer
                          description: Número de fila en el CSV (comenzando desde 2)
                          example: 2
                        dni:
                          type: string
                          example: "12345678"
                        estado:
                          type: string
                          example: "Insertado exitosamente"
                        id:
                          type: integer
                          description: ID del personal creado (solo si fue exitoso)
                          example: 123
                        error:
                          type: string
                          description: Mensaje de error (solo si hubo error)
                          example: "El DNI ya está registrado"
        '400':
          description: Archivo CSV inválido o vacío
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token no válido o no proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  # ─────────────────────────────────────────────────────────────
  # ASISTENCIA
  # ─────────────────────────────────────────────────────────────
  /asistencia/registrar:
    post:
      tags: [Asistencia]
      summary: "REQ-F-006 + REQ-F-014 + REQ-F-015: Validar QR y registrar entrada/salida"
      description: |
        Recibe directamente el contenido del QR escaneado. Internamente:
        1. **Valida el QR** (REQ-F-014): verifica formato, busca al empleado por `id` y `dni`, y comprueba que esté activo.
        2. **Detecta automáticamente** ENTRADA o SALIDA (REQ-F-015):

        | Situación al momento del escaneo | Acción |
        |---|---|
        | Sin registros hoy | Crea nueva ENTRADA (`estado: EN_CURSO`) |
        | Tiene ENTRADA sin SALIDA | Registra SALIDA, calcula `horasTrabajadas` (`estado: COMPLETO`) |
        | Registro del día completo | Crea nueva ENTRADA (horario extendido) |

        `horasTrabajadas` se calcula como la diferencia entre `horaEntrada` y `horaSalida` en formato **HH:MM**.
        
        **Auditoría:** El usuario autenticado que realiza el registro (entrada/salida) será guardado en los campos
        `usuarioId` y `usuarioNombre` para crear un rastro de quién registró la asistencia.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrData]
              properties:
                qrData:
                  type: string
                  description: Contenido del código QR escaneado (JSON string)
                  example: '{"id":5,"dni":"12345678","nombres":"María","apellidos":"García López","cargoId":2}'
      responses:
        '200':
          description: Entrada o salida registrada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  tipo:
                    type: string
                    enum: [ENTRADA, SALIDA]
                    example: "ENTRADA"
                  message:
                    type: string
                    example: "Entrada registrada exitosamente"
                  asistencia:
                    $ref: '#/components/schemas/Asistencia'
        '400':
          description: No se proporcionó el ID del personal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token no válido o no proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /asistencia/hoy/{personalId}:
    get:
      tags: [Asistencia]
      summary: Obtener registros de asistencia del día actual de un empleado
      description: |
        Retorna todos los registros de asistencia del día corriente
        para el personal indicado, junto con el total de horas trabajadas
        acumuladas en el día.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: personalId
          required: true
          schema:
            type: integer
          description: ID del personal
          example: 5
      responses:
        '200':
          description: Registros del día y total de horas trabajadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  fecha:
                    type: string
                    format: date
                    example: "2026-03-08"
                  registros:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asistencia'
                  totalHoras:
                    type: string
                    description: Suma de horas trabajadas en el día en formato HH:MM
                    example: "08:55"
        '401':
          description: Token no válido o no proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /asistencia/reporte:
    get:
      tags: [Asistencia]
      summary: "REQ-F-007: Reporte de asistencias con filtros y paginación"
      description: |
        Genera un reporte detallado de asistencias. Permite filtrar por:
        - Rango de fechas (`fechaInicio` y/o `fechaFin`)
        - Personal específico (`personalId`)
        - Paginación (`pagina`, `limite`)
        
        Los resultados incluyen datos completos del personal (cargo, distrito, nivel/modalidad,
        institución educativa si aplica). Ordenados por fecha descendente.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: fechaInicio
          schema:
            type: string
            format: date
          description: Fecha de inicio del rango (YYYY-MM-DD)
          example: "2026-03-01"
        - in: query
          name: fechaFin
          schema:
            type: string
            format: date
          description: Fecha de fin del rango (YYYY-MM-DD)
          example: "2026-03-31"
        - in: query
          name: personalId
          schema:
            type: integer
          description: Filtrar por un empleado específico (opcional)
          example: 5
        - in: query
          name: pagina
          schema:
            type: integer
            default: 1
          description: Número de página
        - in: query
          name: limite
          schema:
            type: integer
            default: 10
          description: Resultados por página
      responses:
        '200':
          description: Reporte de asistencias paginado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaPaginada'
                  - type: object
                    properties:
                      asistencias:
                        type: array
                        items:
                          $ref: '#/components/schemas/Asistencia'
        '401':
          description: Token no válido o no proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  # ─────────────────────────────────────────────────────────────
  # INSTITUCIONES EDUCATIVAS
  # ─────────────────────────────────────────────────────────────
  /institucionesEducativas:
    post:
      tags: [Instituciones Educativas]
      summary: Crear una nueva institución educativa
      description: |
        Registra una nueva institución educativa en el sistema.
        El `codigoModular` debe ser único.
        
        **Campos requeridos:** codigoModular, nombreIE, nivelModalidad, distritoId
        
        Cuando se asigna un `distritoId` a una institución educativa,
        todos los personal que usen esta institución heredarán automáticamente
        su distrito (sobrescribiendo cualquier distrito seleccionado previamente).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigoModular, nombreIE, nivelModalidad, distritoId]
              properties:
                codigoModular:
                  type: string
                  description: Código modular único de la institución
                  example: "0281774"
                nombreIE:
                  type: string
                  description: Nombre oficial de la institución educativa
                  example: "22226 NUESTRA SEÑORA DE FATIMA"
                nivelModalidad:
                  type: string
                  enum: [INICIAL-JARDIN, PRIMARIA, SECUNDARIA, EBA-CEPTPRO]
                  description: Nivel/modalidad educativa
                  example: "PRIMARIA"
                distritoId:
                  type: integer
                  description: ID del distrito donde está ubicada la institución. El personal heredará automáticamente este distrito
                  example: 1
      responses:
        '201':
          description: Institución educativa creada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaExito'
                  - type: object
                    properties:
                      institucionEducativa:
                        $ref: '#/components/schemas/InstitucionEducativa'
        '400':
          description: |
            Validación fallida. Posibles errores:
            - Faltan campos requeridos (codigoModular, nombreIE, nivelModalidad, distritoId)
            - Código modular duplicado
            - Nivel/modalidad inválido
            - Distrito inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token no válido o no proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

    get:
      tags: [Instituciones Educativas]
      summary: Obtener lista de instituciones educativas
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: estado
          schema:
            type: boolean
          description: Filtrar por estado activo/inactivo
          example: true
        - in: query
          name: nivelModalidad
          schema:
            type: string
            enum: [INICIAL-JARDIN, PRIMARIA, SECUNDARIA, EBA-CEPTPRO]
          description: Filtrar por nivel/modalidad
          example: "PRIMARIA"
      responses:
        '200':
          description: Lista de instituciones educativas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  institucionesEducativas:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstitucionEducativa'
        '401':
          description: Token no válido o no proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'

  /institucionesEducativas/{id}:
    put:
      tags: [Instituciones Educativas]
      summary: Actualizar una institución educativa
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID de la institución educativa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codigoModular:
                  type: string
                  example: "0281775"
                nombreIE:
                  type: string
                  example: "22227 SAN JOSÉ"
                nivelModalidad:
                  type: string
                  enum: [INICIAL-JARDIN, PRIMARIA, SECUNDARIA, EBA-CEPTPRO]
                  example: "SECUNDARIA"
                distritoId:
                  type: integer
                  nullable: true
                  description: ID del distrito donde está ubicada la institución. El personal heredará este distrito automáticamente
                  example: 2
                estado:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Institución educativa actualizada correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespuestaExito'
                  - type: object
                    properties:
                      institucionEducativa:
                        $ref: '#/components/schemas/InstitucionEducativa'
        '400':
          description: Código modular duplicado o nivelModalidad inválida
          content:
