openapi: 3.0.3
info:
  title: Authentication Service API
  version: 1.0.0
  description: |
    Microservicio de autenticación centralizado para gestionar usuarios y generación de tokens JWT.
    
    Este servicio proporciona:
    - Registro de nuevos usuarios
    - Login y generación de tokens JWT
    - Validación de tokens
    - Gestión de datos del usuario (cambiar datos, cambiar contraseña)
    
    **Autenticación:** Los endpoints protegidos requieren un token JWT en el header:
    ```
    Authorization: Bearer <token>
    ```
    
    El token se obtiene mediante `POST /usuarios/login` y tiene validez de 24 horas.
    
  contact:
    name: Equipo de Desarrollo
    email: dev@example.com
  license:
    name: ISC

servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local
  - url: https://auth-service.vercel.app
    description: Servidor de producción (Vercel)

tags:
  - name: Autenticación
    description: Endpoints de autenticación - Login y Registro
  - name: Usuarios
    description: Gestión de perfil de usuario autenticado
  - name: Administración
    description: Endpoints de administración (requieren token)

paths:
  /usuarios/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión y obtener token JWT
      description: |
        Autentica un usuario con email y contraseña.
        Retorna un token JWT válido por 24 horas.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "usuario@example.com"
                password:
                  type: string
                  format: password
                  example: "MiPassword123!"
              required:
                - email
                - password
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login exitoso"
                  token:
                    type: string
                    description: Token JWT válido por 24 horas
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  usuariologeado:
                    $ref: '#/components/schemas/UsuarioLogin'
        '400':
          description: Usuario no encontrado o contraseña incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /usuarios/registrar:
    post:
      tags:
        - Autenticación
      summary: Registrar nuevo usuario
      description: |
        Crea una nueva cuenta de usuario en el sistema.
        El email debe ser único.
        La contraseña se encripta automáticamente con bcrypt.
      operationId: registrar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: "Juan Pérez García"
                email:
                  type: string
                  format: email
                  example: "juan@example.com"
                telefono:
                  type: string
                  example: "987654321"
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: "MiPassword123!"
                rol:
                  type: string
                  enum: [usuario, admin]
                  default: usuario
                  example: "usuario"
              required:
                - nombre
                - email
                - telefono
                - password
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: "Usuario Juan Pérez García con ID 1 creado exitosamente"
        '400':
          description: |
            Error de validación:
            - Email ya registrado
            - Nombre ya registrado
            - Faltan campos obligatorios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /usuarios/datos:
    put:
      tags:
        - Usuarios
      summary: Actualizar datos del perfil
      description: |
        Actualiza el nombre, email o teléfono del usuario autenticado.
        Requiere token JWT válido.
      operationId: cambiarDatos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: "Juan Pérez González"
                email:
                  type: string
                  format: email
                  example: "nuevo.email@example.com"
                telefono:
                  type: string
                  example: "998765432"
      responses:
        '200':
          description: Datos actualizados correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Datos actualizados correctamente"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Usuario'
        '400':
          description: |
            Error de validación:
            - Email ya está registrado por otro usuario
            - Nombre ya está registrado por otro usuario
            - Teléfono ya está registrado por otro usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token no válido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /usuarios/password:
    put:
      tags:
        - Usuarios
      summary: Cambiar contraseña
      description: |
        Permite al usuario cambiar su contraseña.
        Requiere token JWT válido y la contraseña actual.
      operationId: cambiarPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                passwordActual:
                  type: string
                  format: password
                  example: "MiPasswordAntiguo123!"
                passwordNueva:
                  type: string
                  format: password
                  minLength: 6
                  example: "MiPasswordNuevo456!"
              required:
                - passwordActual
                - passwordNueva
      responses:
        '200':
          description: Contraseña actualizada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Contraseña actualizada correctamente"
        '400':
          description: Contraseña actual incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token no válido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /usuarios:
    get:
      tags:
        - Administración
      summary: Listar todos los usuarios
      description: |
        Lista todos los usuarios del sistema con opciones de filtrado y paginación.
        Requiere token JWT válido.
      operationId: consultar
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          description: Filtrar por estado (true/false)
          schema:
            type: string
            enum: [true, false]
          example: "true"
        - name: pagina
          in: query
          description: Número de página (por defecto 1)
          schema:
            type: integer
            default: 1
          example: 1
        - name: limite
          in: query
          description: Cantidad de registros por página (por defecto 10)
          schema:
            type: integer
            default: 10
          example: 10
      responses:
        '200':
          description: Lista de usuarios obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  usuarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/Usuario'
                  total:
                    type: integer
                    example: 25
                  pagina:
                    type: integer
                    example: 1
                  limite:
                    type: integer
                    example: 10
        '401':
          description: Token no válido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT obtenido mediante POST /usuarios/login.
        Incluir en el header: Authorization: Bearer <token>

  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: "Juan Pérez García"
        email:
          type: string
          format: email
          example: "juan@example.com"
        telefono:
          type: string
          example: "987654321"
        rol:
          type: string
          enum: [usuario, admin]
          example: "usuario"
        estado:
          type: boolean
          example: true
        createdat:
          type: string
          format: date-time
          example: "2026-05-26T10:30:00Z"
        updatedat:
          type: string
          format: date-time
          example: "2026-05-26T10:30:00Z"

    UsuarioLogin:
      type: object
      description: Información del usuario retornada en el login
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: "Juan Pérez García"
        email:
          type: string
          format: email
          example: "juan@example.com"
        rol:
          type: string
          enum: [usuario, admin]
          example: "usuario"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Descripción del error"

security:
  - bearerAuth: []

x-readme:
  explorer-enabled: true
  samples-enabled: true
  samples-languages:
    - curl
    - javascript
    - python
